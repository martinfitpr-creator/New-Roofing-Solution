<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Roofing Solutions | SABS Approved Roofing & Waterproofing</title>
    <meta name="description" content="New Roofing Solutions provides SABS-certified roofing sheets, corrugated & IBR profiles, leak repairs, structural waterproofing, and site assessments across Midrand and Gauteng." />
    <meta name="keywords" content="roofing contractors midrand, IBR roofing sheets, corrugated roofing, roof repairs gauteng, waterproofing south africa" />
    <meta name="theme-color" content="#F96302" />
    
    <!-- Preconnect for fast Google Font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#060708] text-slate-100 antialiased">
    <!-- Netlify Form Detection (Hidden static form fallback for build bots) -->
    <form
      name="quote-request"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="quote-request" />
      <input name="bot-field" type="text" />

      <input name="name" type="text" required />
      <input name="fullName" type="text" />
      <input name="email" type="email" required />
      <input name="phone" type="tel" />
      <input name="service" type="text" />
      
      <textarea name="message"></textarea>

      <button type="submit">Get a Quote</button>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Suppress host badges / preview drawers -->
    <script>
      (function() {
        const removeBadges = () => {
          const selectors = [
            'netlify-drawer',
            '#netlify-drawer',
            '.netlify-drawer',
            '[data-netlify-drawer]',
            '[data-netlify-badge]',
            'iframe[src*="netlify"]',
            'iframe[id*="netlify"]'
          ];
          selectors.forEach(sel => {
            document.querySelectorAll(sel).forEach(el => el.remove());
          });
        };
        document.addEventListener('DOMContentLoaded', removeBadges);
        const observer = new MutationObserver(removeBadges);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
